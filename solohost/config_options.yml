# config_options.yml — form cài đặt Pi Desktop hiển thị. Tên mỗi trường = khóa .env được ghi khi cài.
title: Trợ lý thời gian của bạn
description: Lịch và nhắc việc tiếng Việt chạy cục bộ. Trợ lý AI là tùy chọn và mặc định tắt; khi tắt, lịch và nhắc việc vẫn hoạt động đầy đủ.
output_file: .env

fixed_values:
  - name: UID
    detect: uid

fields:
  - name: AI_MODE
    label: Tính năng nâng cao (tùy chọn)
    type: select
    default: 'off'
    help: Tắt hết là lựa chọn nhẹ nhất; lịch và nhắc việc vẫn đầy đủ. Trợ lý AI giúp hiểu câu khó. Nhập bằng giọng nói cho phép nói thay vì gõ, chạy hoàn toàn trên máy (lần đầu tải mô hình khoảng 0,5 GB).
    options:
      - value: 'off'
        label: "Tắt hết (khuyến nghị)"
      - value: voice
        label: "Nhập bằng giọng nói"
        set:
          COMPOSE_PROFILES: voice
      - value: ai
        label: "Trợ lý AI"
        set:
          COMPOSE_PROFILES: ai
      - value: both
        label: "Cả giọng nói và Trợ lý AI"
        set:
          COMPOSE_PROFILES: "ai,voice"

  - name: VOICE_MODEL
    label: Độ chính xác giọng nói
    type: select
    default: small
    help: Mô hình lớn nhận đúng hơn nhưng chậm hơn và tốn RAM hơn. Nên bắt đầu với Cân bằng, thấy sai nhiều mới đổi.
    visible_if:
      field: AI_MODE
      in: [voice, both]
    options:
      - value: base
        label: "Nhanh, nhẹ (hơi kém chính xác)"
      - value: small
        label: "Cân bằng (khuyến nghị)"
      - value: medium
        label: "Chính xác hơn (chậm, cần ~3 GB RAM)"

  - name: AI_TIER
    label: Mức mô hình AI
    type: select
    default: auto
    help: Để Tự động thì app đo RAM, CPU, ổ đĩa rồi chọn mô hình mạnh nhất máy chạy được. Chỉ chọn tay khi cần ép một mức cụ thể.
    visible_if:
      field: AI_MODE
      in: [ai, both]
    options:
      - value: auto
        label: Tự động theo cấu hình máy (khuyến nghị)
      - value: tiny
        label: Rất nhẹ – Qwen3 1.7B (cần ~3 GB RAM)
      - value: light
        label: Nhẹ – Qwen3 4B (cần ~5 GB RAM)
      - value: medium
        label: Trung bình – Qwen3 8B (cần ~9 GB RAM)
      - value: large
        label: Lớn – Qwen3 30B-A3B Q4 (cần ~22 GB RAM)
      - value: xlarge
        label: Rất lớn – Qwen3 30B-A3B Q8 (cần ~46 GB RAM)

  - name: AI_MEMORY
    label: RAM tối đa cho AI
    type: select
    default: 48g
    help: Đây là mức trần. App sẽ chọn mô hình vừa với mức này. Nên để máy còn trống ít nhất 4–6 GB cho Windows.
    visible_if:
      field: AI_MODE
      in: [ai, both]
    options:
      - value: 4g
        label: 4 GB
      - value: 8g
        label: 8 GB
      - value: 12g
        label: 12 GB
      - value: 16g
        label: 16 GB
      - value: 24g
        label: 24 GB
      - value: 48g
        label: 48 GB (mặc định, đủ cho mức lớn nhất)
      - value: 96g
        label: 96 GB

  - name: AI_THREADS
    label: Số luồng CPU cho AI
    type: select
    default: auto
    help: Tự động dùng khoảng số nhân thật của máy, tối đa 24.
    visible_if:
      field: AI_MODE
      in: [ai, both]
    options:
      - value: auto
        label: Tự động (khuyến nghị)
      - value: '4'
        label: 4 luồng
      - value: '8'
        label: 8 luồng
      - value: '16'
        label: 16 luồng
      - value: '24'
        label: 24 luồng

  - name: PANEL_PORT
    label: Cổng truy cập app
    type: select
    default: '18763'
    help: Cổng trên máy này để mở app. Chỉ đổi khi cổng mặc định đang bị chương trình khác dùng.
    options:
      - value: '18763'
        label: "Cổng 18763 (mặc định)"
      - value: '18764'
        label: "Cổng 18764"
      - value: '18765'
        label: "Cổng 18765"
      - value: '28763'
        label: "Cổng 28763"
